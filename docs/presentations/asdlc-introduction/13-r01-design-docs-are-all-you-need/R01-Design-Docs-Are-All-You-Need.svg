 <rect x="29" y="33" width="27" height="23" rx="5" fill="none" stroke="#0b5ed7" stroke-width="3"/><circle cx="37" cy="43" r="2" fill="#0b5ed7"/><circle cx="48" cy="43" r="2" fill="#0b5ed7"/>
 <text x="86" y="45" class="heading">Coding agents</text>
 <text x="19" y="102" class="body">One bounded task per doc,</text>
 <text x="19" y="132" class="body">in dependency order</text>
 <text x="19" y="161" class="small">Orchestrator logs ambiguity</text>
</g>

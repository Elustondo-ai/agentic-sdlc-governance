<path d="M84 496h1431" stroke="#d4e2f4" stroke-width="2"/>
<text x="84" y="538" class="heading blue">HOW THIS COMPARES WITH SDLC 2</text>
<rect x="84" y="558" width="687" height="214" rx="17" fill="#f5f8fd" stroke="#c7d6ed" stroke-width="2"/>
<text x="112" y="600" class="heading">SMART, in this paper</text>
<text x="112" y="643" class="body">Durable artifact: design-doc graph</text>
<text x="112" y="680" class="body">Delivery: regenerate a specialized library</text>
<text x="112" y="717" class="body">Proof: model checks against known references</text>
<text x="112" y="751" class="small">One bounded domain and implementation strategy</text>
<rect x="790" y="558" width="725" height="214" rx="17" fill="#f3fbf7" stroke="#a9d9c2" stroke-width="2"/>
<text x="819" y="600" class="heading green">SDLC 2, as proposed</text>
<text x="819" y="643" class="body">Durable asset: structured project knowledge</text>
<text x="819" y="680" class="body">Scope: 12 steps across product, release, sprint</text>
<text x="819" y="717" class="body">Evidence: tests, QA, operations, observations</text>
<text x="819" y="751" class="small">Code may evolve or regenerate when appropriate</text>
<rect x="84" y="799" width="1431" height="65" rx="14" fill="#102b59"/>
<text x="109" y="840" class="body white">Borrow: worked examples, dependency links, reconciliation checks, and ambiguity logs.</text>

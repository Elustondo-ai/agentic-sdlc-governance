<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">R01: Design Docs Are All You Need, compared with SDLC 2</title>
<desc id="desc">The SMART paper's workflow runs from a dependency graph of human-edited design documents to coding agents, a regenerated symbolic ML performance library, and reconciliation with reference models. The comparison says SDLC 2 can adopt worked examples, traceable dependencies, reconciliation checks, and ambiguity logs without requiring every project to regenerate all code.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">From code-centric to structured knowledge</title>
<desc id="desc">The original contrast layout is retained. On the left, capture, structure, and use project knowledge. On the right, code alone is contrasted with code connected to a taxonomy, domain relationships, trace links, and agent-readable governance.</desc>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102148}
.kicker{font-size:22px;font-weight:700;letter-spacing:1.2px;fill:#0b58dc}
.title{font-size:61px;font-weight:750}
.statement{font-size:26px;font-weight:600}
.cardtitle{font-size:24px;font-weight:700}
.body{font-size:21px}
.small{font-size:18px}
.micro{font-size:17px;font-weight:700}
.blue{fill:#0759e6}.navy{fill:#102148}.muted{fill:#64718a}.white{fill:#fff}
</style>
<linearGradient id="bluecard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafdff"/><stop offset="1" stop-color="#ebf4ff"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="#fff"/>
<rect x="0" y="0" width="1600" height="10" fill="#0b5fea"/>

<text x="91" y="75" class="kicker">SDLC 2  /  PROJECT KNOWLEDGE</text>
<text x="91" y="148" class="title navy">From code-centric to</text>
<text x="91" y="220" class="title blue">structured knowledge.</text>
<rect x="92" y="239" width="87" height="6" rx="3" fill="#0b5fea"/>
<text x="92" y="290" class="statement navy">Agents need more than source files.</text>
<text x="92" y="327" class="statement">They need organized project context.</text>

<rect x="89" y="368" width="615" height="343" rx="20" fill="#fff" stroke="#dbe3f0" stroke-width="2"/>
<circle cx="142" cy="428" r="29" fill="#eaf2ff"/>
<path d="M126 417q16-8 16 3q0-11 16-3v23q-16-7-16 4q0-11-16-4z" fill="none" stroke="#0b5fea" stroke-width="3" stroke-linejoin="round"/>
<text x="194" y="420" class="cardtitle">Capture</text>
<text x="194" y="451" class="body">Intent, use cases, rules, decisions.</text>
<path d="M111 480H680" stroke="#dbe3f0" stroke-width="2"/>

<circle cx="142" cy="539" r="29" fill="#eaf2ff"/>
<circle cx="128" cy="535" r="5" fill="#0b5fea"/><circle cx="154" cy="526" r="5" fill="#0b5fea"/><circle cx="157" cy="552" r="5" fill="#0b5fea"/>
<path d="M132 534l18-6m-19 10l23 12m1-19l2 16" stroke="#0b5fea" stroke-width="2"/>
<text x="194" y="530" class="cardtitle">Structure</text>
<text x="194" y="561" class="body">Taxonomy, relationships, trace links.</text>
<path d="M111 590H680" stroke="#dbe3f0" stroke-width="2"/>

<circle cx="142" cy="648" r="29" fill="#eaf2ff"/>
<circle cx="141" cy="650" r="14" fill="none" stroke="#0b5fea" stroke-width="3"/><circle cx="141" cy="650" r="5" fill="#0b5fea"/>
<path d="M153 638l13-13m-5 0h5v5" fill="none" stroke="#0b5fea" stroke-width="3" stroke-linecap="round"/>
<text x="194" y="640" class="cardtitle">Use</text>
<text x="194" y="671" class="body">Give agents context and constraints.</text>

<rect x="735" y="87" width="348" height="624" rx="20" fill="#f8f9fc" stroke="#dbe1ec" stroke-width="2"/>
<rect x="1101" y="87" width="410" height="624" rx="20" fill="url(#bluecard)" stroke="#a9c7fb" stroke-width="2"/>
<text x="909" y="136" class="cardtitle navy" text-anchor="middle">CODE ALONE</text>
<text x="1305" y="136" class="blue" font-size="20" font-weight="700" text-anchor="middle">CODE + STRUCTURED KNOWLEDGE</text>

<g transform="translate(803 171)">
  <rect x="0" y="0" width="214" height="117" rx="12" fill="#102148"/>
  <rect x="9" y="9" width="196" height="91" rx="4" fill="#fff"/>
  <text x="24" y="67" font-family="monospace" font-size="38" font-weight="700" fill="#102148">&lt;/&gt;</text>
  <path d="M108 38h73m-73 18h52m-52 18h66" stroke="#bec8d8" stroke-width="5" stroke-linecap="round"/>
  <path d="M-15 120h244l-18 12H3z" fill="#102148"/>
</g>
<rect x="760" y="330" width="296" height="93" rx="13" fill="#fff"/>
<text x="908" y="363" class="cardtitle" text-anchor="middle">Implementation</text>
<text x="908" y="393" class="body" text-anchor="middle">What the code does</text>
<text x="774" y="484" class="body">◆ Rationale may be scattered</text>
<text x="774" y="539" class="body">◆ Context must be inferred</text>
<text x="774" y="594" class="body">◆ Review follows file by file</text>

<g transform="translate(1146 164)">
  <rect x="75" y="41" width="178" height="66" rx="13" fill="#fff" stroke="#1d6ce8" stroke-width="2"/>
  <text x="164" y="68" class="micro blue" text-anchor="middle">DOMAIN MODEL</text>
  <text x="164" y="91" class="small" text-anchor="middle">concepts + rules</text>
  <rect x="0" y="0" width="113" height="49" rx="12" fill="#dceaff" stroke="#1d6ce8" stroke-width="2"/>
  <text x="57" y="31" class="micro blue" text-anchor="middle">INTENT</text>
  <rect x="255" y="0" width="113" height="49" rx="12" fill="#dceaff" stroke="#1d6ce8" stroke-width="2"/>
  <text x="312" y="31" class="micro blue" text-anchor="middle">TESTS</text>
  <rect x="129" y="129" width="103" height="49" rx="12" fill="#dceaff" stroke="#1d6ce8" stroke-width="2"/>
  <text x="181" y="160" class="micro blue" text-anchor="middle">CODE</text>
  <path d="M100 45l34 21m117 0l35-21M161 108l10 21" fill="none" stroke="#1d6ce8" stroke-width="3"/>
</g>
<rect x="1126" y="350" width="360" height="93" rx="13" fill="#fff"/>
<text x="1306" y="383" class="cardtitle blue" text-anchor="middle">Navigable project context</text>
<text x="1306" y="413" class="body" text-anchor="middle">What, why, and under which rules</text>
<text x="1137" y="484" class="body">✓ Taxonomy organizes artifacts</text>
<text x="1137" y="539" class="body">✓ Ontology connects concepts</text>
<text x="1137" y="594" class="body">✓ Governance guides agent action</text>

<rect x="89" y="743" width="1422" height="111" rx="19" fill="#f4f8ff" stroke="#d3e1fb" stroke-width="2"/>
<rect x="89" y="743" width="12" height="111" rx="6" fill="#0b5fea"/>
<text x="125" y="786" class="cardtitle">The shift:</text>
<text x="270" y="786" class="cardtitle navy">Code stays essential. Structured knowledge makes its intent and rationale usable.</text>
<text x="125" y="823" class="body">Agents can propose and check links; humans verify the meaning and the evidence.</text>
</svg>

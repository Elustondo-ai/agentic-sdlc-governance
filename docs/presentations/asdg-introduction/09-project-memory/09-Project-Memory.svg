<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Project memory connects humans, agents, and the running system</title>
<desc id="desc">A layered system map. Structured project memory holds intent and domain knowledge, decisions, code and tests, governance and state, and observations. Humans and agents work together using that memory, move through the twelve-step SDLC, deploy and observe the running system, then feed evidence back into project memory.</desc>
<defs><style>

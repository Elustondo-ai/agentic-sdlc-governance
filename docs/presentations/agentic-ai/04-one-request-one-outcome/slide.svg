<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>One request, one observable outcome</title><desc>AI-MODIFIED - 2026-10-01T13:53Z. Draft for Pablo's review.</desc><rect width="1600" height="900" fill="white"/><rect width="1600" height="11" fill="#0b5ed7"/><text x="80" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">SDLC2  /  AGENTIC AI</text><text x="1480" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="end">AA04</text><text x="80" y="127" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#102447" text-anchor="start">One request, one observable outcome</text><text x="82" y="173" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#516585" text-anchor="start">Proposed LifeBuckets example: “Review today’s open actions”</text><text x="80" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0b5ed7" text-anchor="start">USER</text><text x="390" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0b5ed7" text-anchor="start">AGENT</text><text x="745" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#007f67" text-anchor="start">APPLICATION</text><text x="1150" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#b56b00" text-anchor="start">EVIDENCE</text>

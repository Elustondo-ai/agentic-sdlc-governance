      <text x="82" y="754" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516585" text-anchor="start">If the user later accepts a proposed change: new command, new policy check, new evidence.</text><rect x="80" y="808" width="1440" height="57" rx="6" fill="#102447"/><text x="100" y="844" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">A useful answer and a data change are different outcomes.</text></svg>
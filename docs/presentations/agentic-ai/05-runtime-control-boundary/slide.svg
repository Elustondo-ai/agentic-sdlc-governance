      <rect x="1080" y="529" width="439" height="178" rx="8" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="1108" y="570" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">OBSERVABILITY</text><text x="1108" y="611" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447" text-anchor="start">Trace, latency and cost</text><text x="1108" y="654" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516585" text-anchor="start">Without leaking private data</text><rect x="80" y="808" width="1440" height="57" rx="6" fill="#102447"/><text x="100" y="844" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">The trace explains what happened; the transaction proves what changed.</text></svg>
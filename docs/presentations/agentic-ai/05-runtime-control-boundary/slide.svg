<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>The runtime control boundary</title><desc>AI-MODIFIED - 2026-10-01T13:53Z. Draft for Pablo's review.</desc><rect width="1600" height="900" fill="white"/><rect width="1600" height="11" fill="#0b5ed7"/><text x="80" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">SDLC2  /  AGENTIC AI</text><text x="1480" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="end">AA05</text><text x="80" y="127" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#102447" text-anchor="start">The runtime control boundary</text><text x="82" y="173" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#516585" text-anchor="start">Agent judgment is useful; consequential actions require application enforcement</text><rect x="80" y="250" width="590" height="151" rx="8" fill="#edf3fc" stroke="#0b5ed7" stroke-width="2"/><text x="108" y="291" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">AGENT PROPOSAL</text><text x="108" y="335" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#102447" text-anchor="start">“Mark action A complete”</text><text x="108" y="373" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#516585" text-anchor="start">Reason and requested tool arguments</text>
      <path d="M671,326 L740,326" fill="none" stroke="#b56b00" stroke-width="3" /><path d="M740,326 l-11,-6 l0,12 z" transform="rotate(0 740 326)" fill="#b56b00"/><rect x="743" y="226" width="357" height="201" rx="8" fill="#fff2dc" stroke="#b56b00" stroke-width="2"/><text x="767" y="267" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#b56b00" text-anchor="start">POLICY GATE</text><text x="767" y="307" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447" text-anchor="start">Caller identity</text><text x="767" y="345" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447" text-anchor="start">Action scope</text><text x="767" y="383" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447" text-anchor="start">Confirmation rule</text>
      <path d="M1101,326 L1168,326" fill="none" stroke="#007f67" stroke-width="3" /><path d="M1168,326 l-11,-6 l0,12 z" transform="rotate(0 1168 326)" fill="#007f67"/><rect x="1171" y="250" width="348" height="151" rx="8" fill="#e9f5f1" stroke="#007f67" stroke-width="2"/><text x="1196" y="291" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#007f67" text-anchor="start">APPLICATION EFFECT</text><text x="1196" y="335" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#102447" text-anchor="start">Validated write</text><text x="1196" y="373" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516585" text-anchor="start">or explicit rejection</text>
      <path d="M924,428 L924,495" fill="none" stroke="#b56b00" stroke-width="3" /><circle cx="924" cy="496" r="8" fill="#b56b00"/><path d="M250,496 L1349,496" fill="none" stroke="#cbd8e8" stroke-width="3" />
      <rect x="80" y="529" width="440" height="178" rx="8" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="108" y="570" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">APPROVAL RECORD</text><text x="108" y="611" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447" text-anchor="start">Who approved what state?</text><text x="108" y="654" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516585" text-anchor="start">Before which operation?</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>A bounded runtime agent</title><desc>AI-MODIFIED - 2026-10-01T13:53Z. Draft for Pablo's review.</desc><rect width="1600" height="900" fill="white"/><rect width="1600" height="11" fill="#0b5ed7"/><text x="80" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">SDLC2  /  AGENTIC AI</text><text x="1480" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="end">AA03</text><text x="80" y="127" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#102447" text-anchor="start">A bounded runtime agent</text><text x="82" y="173" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#516585" text-anchor="start">The first implementation uses one managed agent loop and a small tool surface</text><rect x="476" y="226" width="648" height="80" rx="8" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="800" y="279" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#102447" text-anchor="middle">User request through application UI</text><path d="M800,306 L800,355" fill="none" stroke="#0b5ed7" stroke-width="3" /><path d="M800,355 l-11,-6 l0,12 z" transform="rotate(90 800 355)" fill="#0b5ed7"/>
      <rect x="306" y="358" width="988" height="235" rx="8" fill="#edf3fc" stroke="#0b5ed7" stroke-width="2"/><text x="340" y="399" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">MANAGED AGENT LOOP</text><text x="340" y="444" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#102447" text-anchor="start">Instructions + selected context</text><text x="340" y="488" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#102447" text-anchor="start">Model reasoning + tool selection</text><text x="340" y="538" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#102447" text-anchor="start">Session and observable events</text>
      <path d="M795,593 L795,634" fill="none" stroke="#0b5ed7" stroke-width="3" /><path d="M795,634 l-11,-6 l0,12 z" transform="rotate(90 795 634)" fill="#0b5ed7"/><rect x="204" y="638" width="1192" height="118" rx="8" fill="#e9f5f1" stroke="#007f67" stroke-width="2"/><text x="235" y="678" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#007f67" text-anchor="start">APPLICATION TOOL GATE</text><text x="235" y="718" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447" text-anchor="start">validate caller · check policy · execute bounded function · record outcome</text>
      <text x="1308" y="398" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#516585" text-anchor="start">Reference:</text><text x="1308" y="434" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#516585" text-anchor="start">Codex harness</text><text x="1308" y="470" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#516585" text-anchor="start">via Agents API</text>
      <text x="82" y="765" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#516585" text-anchor="start">Example tools: read_today(), propose_update() — illustrative signatures</text><rect x="80" y="808" width="1440" height="57" rx="6" fill="#102447"/><text x="100" y="844" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">The application owns identity, authorization and effects; the agent proposes calls.</text></svg>
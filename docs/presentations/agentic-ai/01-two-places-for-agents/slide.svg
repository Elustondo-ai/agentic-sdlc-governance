<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Agents in development and in the product</title><desc>AI-MODIFIED - 2026-10-01T13:53Z. Draft for Pablo's review.</desc><rect width="1600" height="900" fill="white"/><rect width="1600" height="11" fill="#0b5ed7"/><text x="80" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">SDLC2  /  AGENTIC AI</text><text x="1480" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="end">AA01</text><text x="80" y="127" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#102447" text-anchor="start">Agents in development and in the product</text><text x="82" y="173" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#516585" text-anchor="start">The agent changes role when software moves from construction to operation</text><rect x="82" y="238" width="668" height="481" rx="8" fill="#edf3fc" stroke="#0b5ed7" stroke-width="2"/><rect x="850" y="238" width="668" height="481" rx="8" fill="#e9f5f1" stroke="#007f67" stroke-width="2"/><text x="110" y="279" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">AI-ASSISTED DEVELOPMENT</text><text x="878" y="279" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#007f67" text-anchor="start">AGENTIC APPLICATION</text>
      <text x="110" y="333" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#102447" text-anchor="start">Human developer</text><path d="M365,323 L480,323" fill="none" stroke="#0b5ed7" stroke-width="3" /><path d="M480,323 l-11,-6 l0,12 z" transform="rotate(0 480 323)" fill="#0b5ed7"/><text x="512" y="333" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#102447" text-anchor="start">Codex</text>
      <text x="110" y="390" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#102447" text-anchor="start">Reads specifications and repository context</text><text x="110" y="431" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#102447" text-anchor="start">Proposes code, tests and documentation</text><text x="110" y="472" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#102447" text-anchor="start">Uses development tools under project rules</text>
      <path d="M110,514 L718,514" fill="none" stroke="#cbd8e8" stroke-width="2" /><text x="110" y="566" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#516585" text-anchor="start">Result</text><text x="110" y="608" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#102447" text-anchor="start">Reviewable software change</text><text x="110" y="656" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516585" text-anchor="start">Human review controls acceptance and release</text>
      <text x="878" y="333" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#102447" text-anchor="start">Application user</text><path d="M1168,323 L1273,323" fill="none" stroke="#007f67" stroke-width="3" /><path d="M1273,323 l-11,-6 l0,12 z" transform="rotate(0 1273 323)" fill="#007f67"/><text x="1302" y="333" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#102447" text-anchor="start">Agent</text>
      <text x="878" y="390" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#102447" text-anchor="start">Reads permitted product context</text><text x="878" y="431" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#102447" text-anchor="start">Reasons about a user request</text><text x="878" y="472" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#102447" text-anchor="start">Calls application tools through a boundary</text>
      <path d="M878,514 L1486,514" fill="none" stroke="#cbd8e8" stroke-width="2" /><text x="878" y="566" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#516585" text-anchor="start">Result</text><text x="878" y="608" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#102447" text-anchor="start">Answer or governed action</text><text x="878" y="656" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516585" text-anchor="start">Runtime policy controls each side effect</text><rect x="80" y="808" width="1440" height="57" rx="6" fill="#102447"/><text x="100" y="844" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">One methodology; two operating contexts and two authority models.</text></svg>
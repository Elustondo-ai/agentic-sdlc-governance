<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>The same contract in LangGraph</title><desc>AI-MODIFIED - 2026-10-01T13:53Z. Draft for Pablo's review.</desc><rect width="1600" height="900" fill="white"/><rect width="1600" height="11" fill="#0b5ed7"/><text x="80" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">SDLC2  /  AGENTIC AI</text><text x="1480" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="end">AA07</text><text x="80" y="127" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#102447" text-anchor="start">The same contract in LangGraph</text><text x="82" y="173" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#516585" text-anchor="start">The LifeBuckets request becomes explicit state and transitions</text><rect x="80" y="238" width="1438" height="101" rx="8" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="108" y="278" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">STATE</text><text x="250" y="279" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#102447" text-anchor="start">request · authorized scope · record versions · proposal · approval · outcome</text>
      <rect x="114" y="407" width="234" height="124" rx="8" fill="#edf3fc" stroke="#0b5ed7" stroke-width="2"/><rect x="418" y="407" width="234" height="124" rx="8" fill="#edf3fc" stroke="#0b5ed7" stroke-width="2"/><rect x="722" y="407" width="234" height="124" rx="8" fill="#edf3fc" stroke="#0b5ed7" stroke-width="2"/><rect x="1026" y="407" width="234" height="124" rx="8" fill="#fff2dc" stroke="#b56b00" stroke-width="2"/><rect x="1328" y="407" width="190" height="124" rx="8" fill="#e9f5f1" stroke="#007f67" stroke-width="2"/>
      <text x="231" y="456" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#102447" text-anchor="middle">Load</text><text x="231" y="492" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#102447" text-anchor="middle">context</text>
      <text x="535" y="456" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#102447" text-anchor="middle">Propose</text><text x="535" y="492" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#102447" text-anchor="middle">response</text>
      <text x="839" y="456" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#102447" text-anchor="middle">Validate</text><text x="839" y="492" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#102447" text-anchor="middle">scope</text>
      <text x="1143" y="456" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#102447" text-anchor="middle">Pause for</text><text x="1143" y="492" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#102447" text-anchor="middle">approval</text>
      <text x="1423" y="456" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#102447" text-anchor="middle">Execute</text><text x="1423" y="492" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#102447" text-anchor="middle">and record</text>
      <path d="M349,469 L411,469" fill="none" stroke="#0b5ed7" stroke-width="3" /><path d="M411,469 l-11,-6 l0,12 z" transform="rotate(0 411 469)" fill="#0b5ed7"/><path d="M653,469 L715,469" fill="none" stroke="#0b5ed7" stroke-width="3" /><path d="M715,469 l-11,-6 l0,12 z" transform="rotate(0 715 469)" fill="#0b5ed7"/><path d="M957,469 L1019,469" fill="none" stroke="#b56b00" stroke-width="3" /><path d="M1019,469 l-11,-6 l0,12 z" transform="rotate(0 1019 469)" fill="#b56b00"/><path d="M1261,469 L1321,469" fill="none" stroke="#007f67" stroke-width="3" /><path d="M1321,469 l-11,-6 l0,12 z" transform="rotate(0 1321 469)" fill="#007f67"/>
      <text x="80" y="625" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#516585" text-anchor="start">Checkpoints preserve progress at defined boundaries.</text><text x="80" y="673" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#516585" text-anchor="start">A rejected or expired approval follows a separate outcome path.</text>
      <text x="80" y="747" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516585" text-anchor="start">Illustrative graph, not an implemented LifeBuckets workflow.</text><rect x="80" y="808" width="1440" height="57" rx="6" fill="#102447"/><text x="100" y="844" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">The graph changes orchestration; domain meaning and authority stay intact.</text></svg>
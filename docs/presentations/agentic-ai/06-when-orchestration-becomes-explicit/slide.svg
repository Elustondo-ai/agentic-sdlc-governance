<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>When orchestration becomes explicit</title><desc>AI-MODIFIED - 2026-10-01T13:53Z. Draft for Pablo's review.</desc><rect width="1600" height="900" fill="white"/><rect width="1600" height="11" fill="#0b5ed7"/><text x="80" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">SDLC2  /  AGENTIC AI</text><text x="1480" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="end">AA06</text><text x="80" y="127" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#102447" text-anchor="start">When orchestration becomes explicit</text><text x="82" y="173" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#516585" text-anchor="start">Choose the mechanism according to workflow needs, not perceived seriousness</text><rect x="80" y="241" width="694" height="486" rx="8" fill="#edf3fc" stroke="#0b5ed7" stroke-width="2"/><rect x="826" y="241" width="694" height="486" rx="8" fill="#e9f5f1" stroke="#007f67" stroke-width="2"/>
      <text x="112" y="286" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7" text-anchor="start">BOUNDED AGENT LOOP</text><text x="858" y="286" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#007f67" text-anchor="start">EXPLICIT WORKFLOW GRAPH</text>
      <text x="112" y="345" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#102447" text-anchor="start">One request and a few tools</text><text x="112" y="400" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447" text-anchor="start">Short-lived or simple session</text><text x="112" y="449" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447" text-anchor="start">One clear approval boundary</text><text x="112" y="498" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447" text-anchor="start">Application records outcomes</text><path d="M112,533 L736,533" fill="none" stroke="#cbd8e8" stroke-width="2" /><text x="112" y="583" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#516585" text-anchor="start">Keep this while its behavior</text><text x="112" y="618" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#516585" text-anchor="start">remains understandable and testable.</text>
      <text x="858" y="345" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#102447" text-anchor="start">Branching or multi-step work</text><text x="858" y="400" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447" text-anchor="start">Pause and resume across time</text><text x="858" y="449" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447" text-anchor="start">Several approvals or specialists</text><text x="858" y="498" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447" text-anchor="start">Explicit state and recovery</text><path d="M858,533 L1482,533" fill="none" stroke="#cbd8e8" stroke-width="2" /><text x="858" y="583" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#516585" text-anchor="start">Adopt when these needs are real,</text><text x="858" y="618" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#516585" text-anchor="start">then test each transition.</text>
      <text x="80" y="776" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516585" text-anchor="start">The architectural contract from AA02 stays stable across this choice.</text><rect x="80" y="808" width="1440" height="57" rx="6" fill="#102447"/><text x="100" y="844" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">A bounded agent can be production-grade; a graph earns its complexity.</text></svg>
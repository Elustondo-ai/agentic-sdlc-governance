<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>When “Person” becomes a defined concept</title><desc>AI-MODIFIED - 2026-09-28T14:23Z. SDLC2 formalization chapter. Draft for human review.</desc><rect width="1600" height="900" fill="white"/><rect width="1600" height="11" fill="#0b5ed7"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<text x="80" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7">SDLC2  /  FORMALIZATION</text>
<text x="1440" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7">FG04</text>
<text x="80" y="127" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#102447">When “Person” becomes a defined concept</text>
<text x="82" y="173" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#516585">Illustrative contact-domain model, not a claim about current LifeBuckets code</text>
<rect x="82" y="233" width="620" height="185" rx="0" fill="#edf3fc"/>
<text x="104" y="273" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0b5ed7">DOMAIN DEFINITION</text>
<text x="104" y="322" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#102447">Person: a human contact represented</text>
<text x="104" y="362" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#102447">in this system by a stable identifier.</text>
<rect x="878" y="233" width="640" height="185" rx="0" fill="#eaf5f1"/>
<text x="900" y="273" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#08785e">SEMANTIC CONSTRAINTS</text>
<text x="900" y="320" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447">A name may change without changing identity.</text>
<text x="900" y="359" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447">An identifier alone does not prove a real person.</text>
<path d="M702,321 H865" fill="none" stroke="#0b5ed7" stroke-width="3" marker-end="url(#arr)"/>
<rect x="82" y="463" width="620" height="265" rx="0" fill="white" stroke="#0b5ed7" stroke-width="2"/>
<text x="300" y="506" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#516585">«domain type»</text>
<text x="335" y="546" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#0b5ed7">Person</text>
<path d="M82,567 H702" fill="none" stroke="#0b5ed7" stroke-width="2"/>
<text x="105" y="606" font-family="DejaVu Sans Mono" font-size="25" font-weight="400" fill="#102447">id: PersonId</text>
<text x="105" y="649" font-family="DejaVu Sans Mono" font-size="25" font-weight="400" fill="#102447">displayName: string</text>
<text x="105" y="692" font-family="DejaVu Sans Mono" font-size="25" font-weight="400" fill="#102447">birthDate: LocalDate [0..1]</text>
<path d="M702,593 H865" fill="none" stroke="#0b5ed7" stroke-width="3" marker-end="url(#arr)"/>
<rect x="878" y="463" width="640" height="265" rx="0" fill="#102447"/>
<text x="900" y="501" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#94c1ff">TYPED BOUNDARY</text>
<text x="900" y="548" font-family="DejaVu Sans Mono" font-size="23" font-weight="400" fill="white">parsePerson(input: unknown)</text>
<text x="900" y="588" font-family="DejaVu Sans Mono" font-size="23" font-weight="400" fill="white">  : Result&lt;Person, ValidationError&gt;</text>
<text x="900" y="663" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="white">Runtime checks validate incoming data.</text>
<text x="900" y="698" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="white">Domain rules give those checks meaning.</text>
<rect x="80" y="807" width="1440" height="58" rx="8" fill="#102447"/>
<text x="102" y="845" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="white">The definition, model and validator must agree about the same concept.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>How much should we formalize?</title><desc>AI-MODIFIED - 2026-09-28T14:23Z. SDLC2 formalization chapter. Draft for human review.</desc><rect width="1600" height="900" fill="white"/><rect width="1600" height="11" fill="#0b5ed7"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<text x="80" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7">SDLC2  /  FORMALIZATION</text>
<text x="1440" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b5ed7">FG01</text>
<text x="80" y="127" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#102447">How much should we formalize?</text>
<text x="82" y="173" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#516585">One development request, three ways to express its meaning</text>
<text x="82" y="253" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#102447">“Prepare this sprint for review.”</text>
<text x="84" y="298" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#516585">What must the agent interpret? What can the system check?</text>
<path d="M548,347 V732" fill="none" stroke="#cfdae8" stroke-width="2"/>
<path d="M1039,347 V732" fill="none" stroke="#cfdae8" stroke-width="2"/>
<text x="84" y="376" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0b5ed7">PROSE</text>
<text x="84" y="428" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#102447">Explain what changed.</text>
<text x="84" y="474" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#102447">Check the required tests.</text>
<text x="84" y="520" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#102447">Prepare the walkthrough.</text>
<text x="84" y="650" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516585">Meaning stays in instructions</text>
<text x="84" y="692" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447">Flexible judgment</text>
<text x="84" y="726" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447">Interpretation can vary</text>
<text x="586" y="376" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0b5ed7">CONTRACT</text>
<text x="586" y="429" font-family="DejaVu Sans Mono" font-size="23" font-weight="400" fill="#102447">sprint: sprint-007</text>
<text x="586" y="471" font-family="DejaVu Sans Mono" font-size="23" font-weight="400" fill="#102447">target: ReadyForReview</text>
<text x="586" y="513" font-family="DejaVu Sans Mono" font-size="23" font-weight="400" fill="#102447">requires:</text>
<text x="586" y="555" font-family="DejaVu Sans Mono" font-size="23" font-weight="400" fill="#102447">  tests + walkthrough</text>
<text x="586" y="650" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516585">Conditions become explicit</text>
<text x="586" y="692" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447">Named evidence</text>
<text x="586" y="726" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447">Missing facts become visible</text>
<text x="1077" y="376" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#08785e">OPERATION</text>
<text x="1077" y="429" font-family="DejaVu Sans Mono" font-size="23" font-weight="400" fill="#102447">assessReviewReadiness(</text>
<text x="1077" y="471" font-family="DejaVu Sans Mono" font-size="23" font-weight="400" fill="#102447">  sprint, evidence</text>
<text x="1077" y="513" font-family="DejaVu Sans Mono" font-size="23" font-weight="400" fill="#102447">)</text>
<text x="1077" y="590" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#08785e">Ready  /  Blocked</text>
<text x="1077" y="650" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#516585">A checker returns a result</text>
<text x="1077" y="692" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447">Repeatable mechanics</text>
<text x="1077" y="726" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#102447">Still needs a correct policy</text>
<rect x="80" y="807" width="1440" height="58" rx="8" fill="#102447"/>
<text x="102" y="845" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="white">The design choice is how much meaning to leave to interpretation.</text>
</svg>
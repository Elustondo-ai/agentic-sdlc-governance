<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Configuration, tools, and enforcement are separate</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#0b5fea" stroke-width="2.2"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#fff"/>
<rect x="0" y="0" width="1600" height="9" rx="0" fill="#0b5fea"/>
<text x="86" y="68" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#0b5fea">ASDG  /  CODEX • CLAUDE • COPILOT</text>
<text x="86" y="142" font-family="Inter,Arial,Helvetica,sans-serif" font-size="52" font-weight="760" fill="#102148">Configuration, tools, and enforcement are separate</text>
<text x="88" y="190" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="430" fill="#5f6f87">TOML selects runtime behavior; scripts and MCP tools perform effects.</text>
<rect x="86" y="803" width="1428" height="62" rx="12" fill="#102148"/>
<text x="114" y="844" font-family="Inter,Arial,Helvetica,sans-serif" font-size="24" font-weight="620" fill="#ffffff">A well-worded prompt is not a substitute for a guarded operation.</text>
<text x="1506" y="68" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#5f6f87" text-anchor="end">09 / 13</text>
<rect x="87" y="240" width="900" height="536" rx="18" fill="#101d36"/>
<rect x="87" y="240" width="900" height="55" rx="16" fill="#1b3055"/>
<text x="114" y="278" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="650" fill="#cde6ff">.codex/config.toml  (project, trusted) </text>
<text x="117" y="339" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="470" fill="#d9eeff"># Example: bounded concurrent delegates</text>
<text x="117" y="382" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="470" fill="#d9eeff">[agents]</text>
<text x="117" y="425" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="470" fill="#d9eeff">max_concurrent_threads_per_session = 3</text>
<text x="117" y="468" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="470" fill="#8295b7"></text>
<text x="117" y="511" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="470" fill="#d9eeff"># Runtime tool connection example</text>
<text x="117" y="554" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="470" fill="#d9eeff">[mcp_servers.openaiDeveloperDocs]</text>
<text x="117" y="597" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="470" fill="#d9eeff">url = &quot;https://developers.openai.com/mcp&quot;</text>
<text x="117" y="640" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="470" fill="#8295b7"></text>
<text x="117" y="683" font-family="DejaVu Sans Mono,monospace" font-size="22" font-weight="470" fill="#d9eeff"># Secrets: environment, never repository</text>
<rect x="1013" y="240" width="498" height="536" rx="18" fill="#f6f9fd" stroke="#dbe4f1" stroke-width="1.6"/>
<text x="1043" y="285" font-family="Inter,Arial,Helvetica,sans-serif" font-size="28" font-weight="740" fill="#102148">Interpretation checklist</text>
<rect x="1038" y="338" width="448" height="88" rx="12" fill="#fff" stroke="#dbe4f1" stroke-width="1.6"/>
<text x="1056" y="371" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="740" fill="#0b5fea">CONFIG</text>
<text x="1056" y="401" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#5f6f87">Select client/runtime options</text>
<rect x="1038" y="442" width="448" height="88" rx="12" fill="#fff" stroke="#dbe4f1" stroke-width="1.6"/>
<text x="1056" y="475" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="740" fill="#0b5fea">MCP</text>
<text x="1056" y="505" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#5f6f87">Expose external tools and data</text>
<rect x="1038" y="546" width="448" height="88" rx="12" fill="#fff" stroke="#dbe4f1" stroke-width="1.6"/>
<text x="1056" y="579" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="740" fill="#0b5fea">SCRIPT</text>
<text x="1056" y="609" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#5f6f87">Implement repeatable checks</text>
<rect x="1038" y="650" width="448" height="88" rx="12" fill="#fff" stroke="#dbe4f1" stroke-width="1.6"/>
<text x="1056" y="683" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="740" fill="#0b5fea">GATE</text>
<text x="1056" y="713" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#5f6f87">Validate authority before effects</text>

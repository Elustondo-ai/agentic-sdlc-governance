<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Claude Code: shared meanings, different wrappers</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#0b5fea" stroke-width="2.2"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#fff"/>
<rect x="0" y="0" width="1600" height="9" rx="0" fill="#0b5fea"/>
<text x="86" y="68" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#0b5fea">ASDLC  /  CODEX • CLAUDE • COPILOT</text>
<text x="86" y="142" font-family="Inter,Arial,Helvetica,sans-serif" font-size="52" font-weight="760" fill="#102148">Claude Code: shared meanings, different wrappers</text>
<text x="88" y="190" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="430" fill="#5f6f87">AGENTS.md fallback; skills and named agents use Claude discovery paths.</text>
<rect x="86" y="803" width="1428" height="62" rx="12" fill="#102148"/>
<text x="114" y="844" font-family="Inter,Arial,Helvetica,sans-serif" font-size="24" font-weight="620" fill="#ffffff">Do not rename TOML to Markdown and expect identical role semantics.</text>
<text x="1506" y="68" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#5f6f87" text-anchor="end">10 / 13</text>
<rect x="88" y="249" width="699" height="524" rx="18" fill="#f2f7fe" stroke="#dbe4f1" stroke-width="1.6"/>
<rect x="88" y="249" width="699" height="10" rx="4" fill="#0b5fea"/>
<text x="122" y="310" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="740" fill="#102148">Shared where practical</text>
<rect x="113" y="341" width="647" height="402" rx="13" fill="#fff"/>
<text x="140" y="389" font-family="DejaVu Sans Mono,monospace" font-size="21" font-weight="520" fill="#0b5fea">AGENTS.md read as a fallback when no</text>
<text x="140" y="436" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="520" fill="#102148">applicable CLAUDE.md exists (recent versions)</text>
<text x="140" y="483" font-family="DejaVu Sans Mono,monospace" font-size="23" font-weight="520" fill="#0b5fea">.claude/skills/&lt;name&gt;/SKILL.md</text>
<text x="140" y="530" font-family="DejaVu Sans Mono,monospace" font-size="23" font-weight="520" fill="#0b5fea">→ points at canonical ASDLC skill</text>
<text x="140" y="577" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="520" fill="#102148">Same methodology and review standards</text>
<rect x="830" y="249" width="699" height="524" rx="18" fill="#f6f8fc" stroke="#dbe4f1" stroke-width="1.6"/>
<rect x="830" y="249" width="699" height="10" rx="4" fill="#008d86"/>
<text x="864" y="310" font-family="Inter,Arial,Helvetica,sans-serif" font-size="27" font-weight="740" fill="#102148">Claude-native named agent</text>
<rect x="855" y="341" width="647" height="402" rx="13" fill="#fff"/>
<text x="882" y="389" font-family="DejaVu Sans Mono,monospace" font-size="23" font-weight="520" fill="#0b5fea">.claude/agents/asdlc-reviewer.md</text>
<text x="882" y="436" font-family="DejaVu Sans Mono,monospace" font-size="23" font-weight="520" fill="#102148">---</text>
<text x="882" y="483" font-family="DejaVu Sans Mono,monospace" font-size="23" font-weight="520" fill="#102148">name: asdlc-reviewer</text>
<text x="882" y="530" font-family="DejaVu Sans Mono,monospace" font-size="21" font-weight="520" fill="#102148">description: Independently review changes</text>
<text x="882" y="577" font-family="DejaVu Sans Mono,monospace" font-size="23" font-weight="520" fill="#102148">tools: Read, Grep, Glob</text>
<text x="882" y="624" font-family="DejaVu Sans Mono,monospace" font-size="23" font-weight="520" fill="#102148">---</text>
<text x="882" y="671" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="520" fill="#102148">Report evidence; do not edit files.</text>
</svg>
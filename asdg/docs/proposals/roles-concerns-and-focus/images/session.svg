<text x="42" y="92" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">ROLE 05 · Overall architecture</text>
<text x="42" y="121" font-family="sans-serif" font-size="18" fill="#263e50">No selected concern; the task and responsibility are retained.</text>
<path d="M380 150v17m-6-6 6 6 6-6" fill="none" stroke="#54768e" stroke-width="2"/>
<rect x="24" y="170" width="712" height="86" rx="10" fill="#e2edf7" stroke="#bfd0df"/>
<text x="42" y="200" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">ROLE 05 · Data focus</text>
<text x="42" y="229" font-family="sans-serif" font-size="18" fill="#263e50">Store previous focus; examine the current task through Data.</text>
<path d="M380 258v17m-6-6 6 6 6-6" fill="none" stroke="#54768e" stroke-width="2"/>
<rect x="24" y="278" width="712" height="86" rx="10" fill="#fff" stroke="#bfd0df"/>
<text x="42" y="308" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">ROLE 05 · Overall architecture</text>
<text x="42" y="337" font-family="sans-serif" font-size="18" fill="#263e50">Explicit return clears the concern, not the role or findings.</text>
<path d="M380 366v17m-6-6 6 6 6-6" fill="none" stroke="#54768e" stroke-width="2"/>

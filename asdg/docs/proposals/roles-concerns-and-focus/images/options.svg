<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434" role="img" aria-label="Three ways to organize attention">
<rect width="760" height="434" rx="16" fill="#f2f6fa"/>
<text x="28" y="38" font-family="sans-serif" font-size="24" font-weight="700" fill="#17334d">Three ways to organize attention</text>
<rect x="24" y="62" width="712" height="86" rx="10" fill="#fff" stroke="#bfd0df"/>
<text x="42" y="92" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">CURRENT · Role-only Focus</text>
<text x="42" y="121" font-family="sans-serif" font-size="18" fill="#263e50">Architecture → Purpose changes the conversation's owner.</text>

<rect x="24" y="170" width="712" height="86" rx="10" fill="#e2edf7" stroke="#bfd0df"/>
<text x="42" y="200" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">ALTERNATIVE · Separate combination roles</text>
<text x="42" y="229" font-family="sans-serif" font-size="18" fill="#263e50">Architecture–Data / Architecture–Security / Operations–Data</text>

<rect x="24" y="278" width="712" height="86" rx="10" fill="#fff" stroke="#bfd0df"/>
<text x="42" y="308" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">RECOMMENDED · Role + temporary concern</text>
<text x="42" y="337" font-family="sans-serif" font-size="18" fill="#263e50">Architecture → Architecture / Data → Architecture</text>

<text x="28" y="416" font-family="sans-serif" font-size="17" fill="#38576e">Keep identity stable; make a responsibility change deliberate</text></svg>

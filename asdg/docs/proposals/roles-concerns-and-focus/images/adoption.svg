<text x="42" y="337" font-family="sans-serif" font-size="18" fill="#263e50">Test composition, retention, return and role protection.</text>
<path d="M380 366v17m-6-6 6 6 6-6" fill="none" stroke="#54768e" stroke-width="2"/>

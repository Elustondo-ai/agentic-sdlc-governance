<text x="42" y="200" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">PILOT → Data / Security / Cost</text>
<text x="42" y="229" font-family="sans-serif" font-size="18" fill="#263e50">Start with Architecture and Purpose; keep one Focus entry.</text>

<text x="42" y="416" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">EXPAND → Collaboration and more concerns</text>
<text x="42" y="445" font-family="sans-serif" font-size="18" fill="#263e50">Add guidance where actual tasks demonstrate its value.</text>

<text x="28" y="524" font-family="sans-serif" font-size="17" fill="#38576e">Proposed sequence • no implementation or sprint authorization implied</text></svg>

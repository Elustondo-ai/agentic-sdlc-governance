<svg xmlns="http://www.w3.org/2000/svg" width="760" height="542" viewBox="0 0 760 542" role="img" aria-label="Compose guidance; preserve the shared contract">
<rect width="760" height="542" rx="16" fill="#f2f6fa"/>
<text x="28" y="38" font-family="sans-serif" font-size="24" font-weight="700" fill="#17334d">Compose guidance; preserve the shared contract</text>
<rect x="24" y="62" width="712" height="86" rx="10" fill="#fff" stroke="#bfd0df"/>
<text x="42" y="92" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">SHARED SKILL → Common method and output</text>
<text x="42" y="121" font-family="sans-serif" font-size="18" fill="#263e50">Decision: rationale, alternatives, evidence and consequences.</text>
<path d="M380 150v17m-6-6 6 6 6-6" fill="none" stroke="#54768e" stroke-width="2"/>
<rect x="24" y="170" width="712" height="86" rx="10" fill="#e2edf7" stroke="#bfd0df"/>
<text x="42" y="200" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">ROLE METHOD + CONCERN GUIDE</text>
<text x="42" y="229" font-family="sans-serif" font-size="18" fill="#263e50">Architecture criteria + shared Data knowledge.</text>
<path d="M380 258v17m-6-6 6 6 6-6" fill="none" stroke="#54768e" stroke-width="2"/>
<rect x="24" y="278" width="712" height="86" rx="10" fill="#fff" stroke="#bfd0df"/>
<text x="42" y="308" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">OPTIONAL LOCAL SUPPLEMENT</text>
<text x="42" y="337" font-family="sans-serif" font-size="18" fill="#263e50">Only the useful differences for Architecture and Data.</text>
<path d="M380 366v17m-6-6 6 6 6-6" fill="none" stroke="#54768e" stroke-width="2"/>
<rect x="24" y="386" width="712" height="86" rx="10" fill="#e2edf7" stroke="#bfd0df"/>
<text x="42" y="416" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">ONE RESULT UNDER THE ROLE CONTRACT</text>
<text x="42" y="445" font-family="sans-serif" font-size="18" fill="#263e50">Explain conflicts; do not use a last-file-wins override.</text>

<text x="28" y="524" font-family="sans-serif" font-size="17" fill="#38576e">Missing optional guide → generic method • invalid guide → named gap</text></svg>

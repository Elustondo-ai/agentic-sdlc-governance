<svg xmlns="http://www.w3.org/2000/svg" width="760" height="542" viewBox="0 0 760 542" role="img" aria-label="Interpret meaning before changing context">
<rect width="760" height="542" rx="16" fill="#f2f6fa"/>
<text x="28" y="38" font-family="sans-serif" font-size="24" font-weight="700" fill="#17334d">Interpret meaning before changing context</text>
<rect x="24" y="62" width="712" height="86" rx="10" fill="#fff" stroke="#bfd0df"/>
<text x="42" y="92" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">REQUEST + CURRENT ROLE + TASK</text>
<text x="42" y="121" font-family="sans-serif" font-size="18" fill="#263e50">Resolve role, concern, task and destination separately.</text>

<rect x="24" y="170" width="712" height="86" rx="10" fill="#e2edf7" stroke="#bfd0df"/>
<text x="42" y="200" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">CONCERN IN THIS ROLE → Focus here</text>
<text x="42" y="229" font-family="sans-serif" font-size="18" fill="#263e50">Load guidance, retain the role and announce attention.</text>

<rect x="24" y="278" width="712" height="86" rx="10" fill="#fff" stroke="#bfd0df"/>
<text x="42" y="308" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">DIFFERENT ROLE → Offer a deliberate choice</text>
<text x="42" y="337" font-family="sans-serif" font-size="18" fill="#263e50">Separate chat / switch here / keep current role.</text>

<rect x="24" y="386" width="712" height="86" rx="10" fill="#e2edf7" stroke="#bfd0df"/>
<text x="42" y="416" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">UNCLEAR OR FAILED → Preserve current context</text>
<text x="42" y="445" font-family="sans-serif" font-size="18" fill="#263e50">Ask only the missing question; do not infer a choice.</text>

<text x="28" y="524" font-family="sans-serif" font-size="17" fill="#38576e">A question about Cost alone does not activate persistent Cost focus</text><path d="M24 105H14V429 M14 213h10 M14 321h10 M14 429h10" fill="none" stroke="#54768e" stroke-width="2"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="542" viewBox="0 0 760 542" role="img" aria-label="One shared concern, different responsibilities">
<rect width="760" height="542" rx="16" fill="#f2f6fa"/>
<text x="28" y="38" font-family="sans-serif" font-size="24" font-weight="700" fill="#17334d">One shared concern, different responsibilities</text>
<rect x="24" y="62" width="712" height="86" rx="10" fill="#fff" stroke="#bfd0df"/>
<text x="42" y="92" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">SHARED CONCERN · Data, Security or Cost</text>
<text x="42" y="121" font-family="sans-serif" font-size="18" fill="#263e50">Common meaning, questions, evidence and trade-offs.</text>

<rect x="24" y="170" width="712" height="86" rx="10" fill="#e2edf7" stroke="#bfd0df"/>
<text x="42" y="200" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">PURPOSE → Desired outcome</text>
<text x="42" y="229" font-family="sans-serif" font-size="18" fill="#263e50">What matters to people and the business?</text>

<rect x="24" y="278" width="712" height="86" rx="10" fill="#fff" stroke="#bfd0df"/>
<text x="42" y="308" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">ARCHITECTURE → Design choices</text>
<text x="42" y="337" font-family="sans-serif" font-size="18" fill="#263e50">Which responsibilities and dependencies meet those needs?</text>

<rect x="24" y="386" width="712" height="86" rx="10" fill="#e2edf7" stroke="#bfd0df"/>
<text x="42" y="416" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">EVALUATION + OPERATIONS → Evidence</text>
<text x="42" y="445" font-family="sans-serif" font-size="18" fill="#263e50">How do we test it, and what happens in real use?</text>

<text x="28" y="524" font-family="sans-serif" font-size="17" fill="#38576e">Shared knowledge • different contributions • existing role boundaries</text><path d="M24 105H14V429 M14 213h10 M14 321h10 M14 429h10" fill="none" stroke="#54768e" stroke-width="2"/></svg>

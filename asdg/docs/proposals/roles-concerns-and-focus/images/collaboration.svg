<svg xmlns="http://www.w3.org/2000/svg" width="760" height="542" viewBox="0 0 760 542" role="img" aria-label="Parallel attention with one integration owner">
<rect width="760" height="542" rx="16" fill="#f2f6fa"/>
<text x="28" y="38" font-family="sans-serif" font-size="24" font-weight="700" fill="#17334d">Parallel attention with one integration owner</text>
<rect x="24" y="62" width="712" height="86" rx="10" fill="#fff" stroke="#bfd0df"/>
<text x="42" y="92" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">GENERAL ARCHITECT → Bounded Data brief</text>
<text x="42" y="121" font-family="sans-serif" font-size="18" fill="#263e50">Pass question, sources, limits and expected evidence.</text>
<path d="M380 150v17m-6-6 6 6 6-6" fill="none" stroke="#54768e" stroke-width="2"/>
<rect x="24" y="170" width="712" height="86" rx="10" fill="#e2edf7" stroke="#bfd0df"/>
<text x="42" y="200" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">DATA-FOCUSED ARCHITECT → Investigation</text>
<text x="42" y="229" font-family="sans-serif" font-size="18" fill="#263e50">Same role; different attention; explicit authorization.</text>
<path d="M380 258v17m-6-6 6 6 6-6" fill="none" stroke="#54768e" stroke-width="2"/>
<rect x="24" y="278" width="712" height="86" rx="10" fill="#fff" stroke="#bfd0df"/>
<text x="42" y="308" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">RETURN → Findings and consequences</text>
<text x="42" y="337" font-family="sans-serif" font-size="18" fill="#263e50">Include evidence limits and effects on other concerns.</text>
<path d="M380 366v17m-6-6 6 6 6-6" fill="none" stroke="#54768e" stroke-width="2"/>
<rect x="24" y="386" width="712" height="86" rx="10" fill="#e2edf7" stroke="#bfd0df"/>
<text x="42" y="416" font-family="sans-serif" font-size="21" font-weight="700" fill="#174c70">GENERAL ARCHITECT → Integrated decision</text>
<text x="42" y="445" font-family="sans-serif" font-size="18" fill="#263e50">Reconcile trade-offs; human decides consequential choices.</text>

<text x="28" y="524" font-family="sans-serif" font-size="17" fill="#38576e">Separate chat or subagent is an execution choice, not a new role</text></svg>

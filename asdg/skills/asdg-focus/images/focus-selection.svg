<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">One Focus entry, three interpretation outcomes</title>
  <desc id="desc">Focus interprets the user's phrase and context. Clear intent proceeds to the selected role. Ambiguity asks among recommended candidates. No match shows twelve specialists and Governance separately. Pending clarification preserves the previous focus.</desc>
  <rect width="760" height="330" rx="16" fill="#f3f7fb"/>
  <g font-family="Arial, sans-serif" fill="#203b50">
    <text x="28" y="36" font-size="22" font-weight="bold">ASDG focus · describe the work in your own words</text>
    <rect x="170" y="57" width="420" height="52" rx="10" fill="#fff" stroke="#8ca7bc"/>
    <text x="380" y="89" text-anchor="middle" font-size="18">Interpret phrase + conversation context</text>
    <path d="M380 109 V130 H140 V148 M380 130 V148 M380 130 H620 V148" fill="none" stroke="#506b83" stroke-width="2"/>
    <rect x="30" y="150" width="220" height="112" rx="10" fill="#e1f1ea" stroke="#40896b"/>
    <text x="140" y="180" text-anchor="middle" font-size="18" font-weight="bold">Clear match</text>
    <text x="140" y="206" text-anchor="middle" font-size="15">Announce the role</text>
    <text x="140" y="232" text-anchor="middle" font-size="15">Load sources → activate</text>
    <rect x="270" y="150" width="220" height="112" rx="10" fill="#fff4df" stroke="#b59a60"/>
    <text x="380" y="180" text-anchor="middle" font-size="18" font-weight="bold">Ambiguous</text>
    <text x="380" y="206" text-anchor="middle" font-size="15">Recommend + alternatives</text>
    <text x="380" y="232" text-anchor="middle" font-size="15">Ask which one</text>
    <rect x="510" y="150" width="220" height="112" rx="10" fill="#e5edf8" stroke="#8ca7bc"/>
    <text x="620" y="180" text-anchor="middle" font-size="18" font-weight="bold">No useful match</text>
    <text x="620" y="206" text-anchor="middle" font-size="15">Show all 12 specialists</text>
    <text x="620" y="232" text-anchor="middle" font-size="15">Governance separately</text>
    <text x="380" y="303" text-anchor="middle" font-size="16">While a choice is pending, keep the previous focus and title.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="title desc">
<title id="title">A durable architecture decision</title>
<desc id="desc">Outcome and constraints guide comparable alternatives; the choice records consequences and a future evidence check can reopen the decision.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#61758a" stroke-width="1.3"/></marker></defs>
<rect x="1" y="1" width="718" height="308" rx="16" fill="#f5f8fb" stroke="#d8e1e9"/>
<g font-family="Arial, sans-serif" fill="#18374b">
<text x="24" y="38" font-size="23" font-weight="700">A decision explains why, and when to reconsider</text>
<g stroke="#bfccd8" fill="#fff"><rect x="24" y="76" width="150" height="110" rx="10"/><rect x="198" y="76" width="150" height="110" rx="10"/><rect x="546" y="76" width="150" height="110" rx="10"/></g>
<rect x="372" y="76" width="150" height="110" rx="10" fill="#e1f3ec" stroke="#43977d"/>
<g font-size="18" font-weight="700"><text x="37" y="105">Why decide?</text><text x="211" y="105">Alternatives</text><text x="385" y="105">Choice</text><text x="559" y="105">Revisit</text></g>
<g font-size="16" fill="#486274"><text x="37" y="137">Outcome and</text><text x="37" y="159">constraints</text><text x="211" y="137">Same need,</text><text x="211" y="159">different costs</text><text x="385" y="137">Scope and</text><text x="385" y="159">consequences</text><text x="559" y="137">New evidence</text><text x="559" y="159">or requirements</text></g>
<g fill="none" stroke="#61758a" stroke-width="1.8" marker-end="url(#a)"><path d="M178 131 H188"/><path d="M352 131 H362"/><path d="M526 131 H536"/><path d="M621 190 V224 H273 V194"/></g>
<text x="24" y="275" font-size="16" fill="#405a70">Record the reasoning; selection alone does not authorize implementation.</text>
</g></svg>


<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Shared decision method with optional specialization</title>
  <desc id="desc">The shared Decision skill resolves the active role. When its local decision skill exists it enriches the method; otherwise generic defaults apply. Both return rationale, options, evidence, choice, consequences and revisit conditions.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#506b83" stroke-width="1.5"/></marker></defs>
  <rect width="760" height="420" rx="16" fill="#f3f7fb"/>
  <g font-family="Arial, sans-serif" fill="#203b50">
    <text x="30" y="36" font-size="22" font-weight="bold">One interface · context enriches the method</text>
    <rect x="230" y="58" width="300" height="64" rx="10" fill="#fff" stroke="#8ca7bc"/>
    <text x="380" y="84" text-anchor="middle" font-size="18" font-weight="bold">Shared ASDG Decision</text>
    <text x="380" y="107" text-anchor="middle" font-size="15">Resolve role and check local skill</text>
    <path d="M300 122 V148 H190 V177" fill="none" stroke="#506b83" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M460 122 V148 H570 V177" fill="none" stroke="#506b83" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="45" y="165" font-size="15">Local skill present</text><text x="600" y="165" font-size="15">No local skill</text>
    <rect x="40" y="185" width="300" height="80" rx="10" fill="#e1f1ea" stroke="#40896b"/>
    <text x="190" y="214" text-anchor="middle" font-size="18" font-weight="bold">Specialist enrichment</text>
    <text x="190" y="239" text-anchor="middle" font-size="15">Criteria, evidence, visuals, triggers</text>
    <rect x="420" y="185" width="300" height="80" rx="10" fill="#fff" stroke="#8ca7bc"/>
    <text x="570" y="214" text-anchor="middle" font-size="18" font-weight="bold">Generic method</text>
    <text x="570" y="239" text-anchor="middle" font-size="15">Use task context and role contract</text>
    <path d="M190 265 V290 H380 M570 265 V290 H380 V313" fill="none" stroke="#506b83" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="90" y="321" width="580" height="67" rx="10" fill="#e5edf8" stroke="#8ca7bc"/>
    <text x="380" y="348" text-anchor="middle" font-size="18" font-weight="bold">Common decision result</text>
    <text x="380" y="373" text-anchor="middle" font-size="15">Why · options · evidence · choice · consequences · revisit</text>
  </g>
</svg>
